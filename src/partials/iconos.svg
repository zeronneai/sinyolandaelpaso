<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <!-- Pintura en aerosol del logo en la cortina: overspray, sombra chocolate y contorno crema -->
  <filter id="f-aerosol" x="-8%" y="-15%" width="118%" height="140%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="gordo"/>
    <feGaussianBlur in="gordo" stdDeviation="10" result="nube"/>
    <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="ruido"/>
    <feComposite in="ruido" in2="nube" operator="in" result="nubeRuido"/>
    <feColorMatrix in="nubeRuido" type="matrix" values="0 0 0 0 .878  0 0 0 0 .651  0 0 0 0 .227  0 0 0 1.6 -.3" result="spray"/>
    <feFlood flood-color="#3B1F14"/>
    <feComposite in2="gordo" operator="in"/>
    <feOffset dx="7" dy="8" result="sombra"/>
    <feFlood flood-color="#F3E4C8"/>
    <feComposite in2="gordo" operator="in" result="contorno"/>
    <feMerge>
      <feMergeNode in="spray"/>
      <feMergeNode in="sombra"/>
      <feMergeNode in="contorno"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <!-- Ojo cerrado llorando -->
  <symbol id="i-ojo" viewBox="0 0 64 64">
    <path d="M8 26c7 9 15 13 24 13s17-4 24-13" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M14 33l-4 6M22 37l-2.5 6.5M32 39v7M42 37l2.5 6.5M50 33l4 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M27 47c0 0 5 6.5 5 10a5 5 0 0 1-10 0c0-3.5 5-10 5-10z" transform="translate(4 -1)" fill="currentColor"/>
  </symbol>

  <!-- Sagrado corazón con llama -->
  <symbol id="i-corazon" viewBox="0 0 64 64">
    <path d="M32 2c4 6-1 8 2 12 2-2 3-4 2-7 5 4 6 10 2 14h-12c-3-3-3-8 1-12 0 3 1 4 3 5-1-5 0-9 2-12z" fill="currentColor"/>
    <path d="M32 58C18 48 8 40 8 29c0-6.5 5-11 11-11 5.5 0 9.5 3 13 7.5C35.5 21 39.5 18 45 18c6 0 11 4.5 11 11 0 11-10 19-24 29z" fill="currentColor"/>
    <path d="M32 29v17M25.5 35h13" stroke="var(--icono-cruz, #FBF1DD)" stroke-width="3.5" stroke-linecap="round"/>
  </symbol>

  <!-- Sombrero vaquero -->
  <symbol id="i-sombrero" viewBox="0 0 64 64">
    <path d="M20 36c-1-9 1-20 5-23 2-1.5 4 .5 7 .5s5-2 7-.5c4 3 6 14 5 23z" fill="currentColor"/>
    <path d="M3 34c4 2 8 7 29 7s25-5 29-7c1 4-2 11-12 13-6 1.3-11 1.8-17 1.8S21 48.3 15 47C5 45 2 38 3 34z" fill="currentColor"/>
    <path d="M20.5 31.5c7 2 16 2 23 0" fill="none" stroke="var(--icono-cruz, #FBF1DD)" stroke-width="2.5"/>
  </symbol>

  <!-- Micrófono -->
  <symbol id="i-micro" viewBox="0 0 64 64">
    <circle cx="32" cy="16" r="12" fill="currentColor"/>
    <path d="M24 12h16M22.5 17h19M24 22h16" stroke="var(--icono-cruz, #FBF1DD)" stroke-width="1.8" opacity=".7"/>
    <path d="M23 27h18l-3 8H26z" fill="currentColor"/>
    <path d="M27 37h10l-1.5 23a3.5 3.5 0 0 1-7 0z" fill="currentColor"/>
  </symbol>

  <!-- Cantarito -->
  <symbol id="i-cantarito" viewBox="0 0 64 64">
    <path d="M21 8h22v4c0 2-2 3-2 5 6 3 11 10 11 19 0 13-9 22-20 22S12 49 12 36c0-9 5-16 11-19 0-2-2-3-2-5z" fill="currentColor"/>
    <path d="M51 26c6 0 8 4 8 8s-3 8-8 8" fill="none" stroke="currentColor" stroke-width="4"/>
    <path d="M17 33c4 2 9 3 15 3s11-1 15-3" fill="none" stroke="var(--icono-cruz, #FBF1DD)" stroke-width="2.5"/>
    <path d="M15 8h34" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
  </symbol>

  <!-- Rayos de sol -->
  <symbol id="i-sol" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="10" fill="currentColor"/>
    <g fill="currentColor">
      <path d="M30 2h4l-2 16zM30 62h4l-2-16zM2 30v4l16-2zM62 30v4l-16-2z"/>
      <path d="M9.5 12.3l2.8-2.8 8.4 13.8zM51.7 54.5l2.8-2.8-13.8-8.4zM12.3 54.5l-2.8-2.8 13.8-8.4zM54.5 12.3l-2.8-2.8-8.4 13.8z"/>
    </g>
  </symbol>

  <!-- Destello de cuatro puntas (separador de la cinta) -->
  <symbol id="i-destello" viewBox="0 0 32 32">
    <path d="M16 0c1.5 9 7 14.5 16 16-9 1.5-14.5 7-16 16-1.5-9-7-14.5-16-16 9-1.5 14.5-7 16-16z" fill="currentColor"/>
  </symbol>

  <symbol id="i-instagram" viewBox="0 0 24 24">
    <rect x="2.5" y="2.5" width="19" height="19" rx="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="12" cy="12" r="4.3" fill="none" stroke="currentColor" stroke-width="2"/>
    <circle cx="17.6" cy="6.4" r="1.3" fill="currentColor"/>
  </symbol>

  <symbol id="i-tiktok" viewBox="0 0 24 24">
    <path d="M16.6 2h-3.4v13.3a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.4 6.4 0 1 0 5.4 6.3V8.6a8 8 0 0 0 4.4 1.4V6.6a4.5 4.5 0 0 1-4.4-4.6z" fill="currentColor"/>
  </symbol>

  <symbol id="i-pin" viewBox="0 0 24 24">
    <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/>
  </symbol>
</svg>
