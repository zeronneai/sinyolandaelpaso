<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Tarjeta Fiestera | Sin Yolanda El Paso</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#C4502A">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/src/styles/plataforma.css">
  <link rel="stylesheet" href="/src/styles/extras.css">
  <script type="module" src="/src/plataforma/tarjeta.js"></script>
</head>
<body class="app">
  <!-- @iconos -->
  <header class="app-top">
    <!-- @papel -->
    <a href="/" aria-label="Ir a Sin Yolanda El Paso"><span class="logo app-top__logo"></span></a>
    <h1 class="app-top__titulo">La Tarjeta Fiestera</h1>
    <p class="app-top__sub">5 sellos y el cantarito va por la casa.</p>
  </header>
  <main class="app-main">
    <a class="btn-texto volver-mesa" id="volver-mesa" hidden>‹ Volver a la mesa</a>
    <form class="tarjeta" id="buscar">
      <div class="campo">
        <label for="tel">Tu WhatsApp</label>
        <input id="tel" name="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="915 555 0123" required>
      </div>
      <button class="btn btn--mostaza btn--grande btn--ancho">Ver mi tarjeta</button>
    </form>
    <form class="tarjeta" id="nueva" hidden>
      <h2 class="tarjeta__titulo">Todavía no tienes tarjeta</h2>
      <p>Te la hacemos ahorita. El host te pone el sello cada que vienes.</p>
      <div class="campo"><label for="nombre">Tu nombre</label><input id="nombre" name="nombre" required autocomplete="name"></div>
      <button class="btn btn--mostaza btn--ancho">Crear mi tarjeta</button>
    </form>
    <div id="carta" aria-live="polite"></div>
  </main>
</body>
</html>
